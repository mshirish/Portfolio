name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Build smoke-test image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: portfolio:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          set -euo pipefail
          base=http://127.0.0.1:8080

          docker run --rm portfolio:smoke nginx -t
          docker run -d --name smoke -p 8080:8080 portfolio:smoke

          for i in $(seq 1 30); do
            curl -fsS "$base/healthz" >/dev/null 2>&1 && break
            if [ "$i" = 30 ]; then docker logs smoke; echo "healthz never came up"; exit 1; fi
            sleep 1
          done

          page=$(curl -fsS "$base/")
          grep -q '<title>Shirish Maharjan' <<<"$page"

          root_headers=$(curl -fsSI "$base/")
          grep -qi '^cache-control: no-cache' <<<"$root_headers"
          grep -qi '^x-content-type-options: nosniff' <<<"$root_headers"

          js=$(grep -o '/assets/[^"]*\.js' <<<"$page" | head -n 1)
          test -n "$js"
          asset_headers=$(curl -fsSI "$base$js")
          grep -qi '^cache-control:.*immutable' <<<"$asset_headers"
          grep -qi '^x-content-type-options: nosniff' <<<"$asset_headers"

          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/healthz")" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/does-not-exist")" = 404

          echo "Smoke test passed"

      - name: Stop smoke container
        if: always()
        run: docker rm -f smoke || true

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
